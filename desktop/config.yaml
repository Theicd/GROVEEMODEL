# GROVEE Desktop — OpenSERP search companion (same as companion/config.yaml)
server:
  host: 127.0.0.1
  port: 7000
  debug: false
  verbose: false
  raw_requests: false
  insecure: true

app:
  log_format: text
  timeout: 20
  browser_path: ""
  head: false
  leakless: false
  max_processes: 4
  idle_ttl: 5m
  mega_timeout: 90s

extract:
  enabled: true
  default_mode: auto
  timeout: 20s
  max_bytes: 2000000
  max_concurrent: 2

proxies:
  allow_request_proxy_url: false

cache:
  ttl_seconds: 120
  max_size: 500

resilience:
  max_retries: 1
  allow_endpoint_fallback: false

cors:
  enabled: true
  allow_origins: "*"
  allow_methods: "GET, POST, OPTIONS"
  allow_headers: "Origin, Content-Type, Accept, Authorization, X-Use-Proxy"
  max_age: 86400

google:
  rate_requests: 60
  rate_burst: 3

yandex:
  rate_requests: 60
  rate_burst: 3

baidu:
  rate_requests: 60
  rate_burst: 3

bing:
  rate_requests: 60
  rate_burst: 3

duckduckgo:
  rate_requests: 60
  rate_burst: 3

ecosia:
  rate_requests: 60
  rate_burst: 3
